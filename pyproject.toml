[tool.ruff]
line-length = 88
target-version = "py311"

# The *_lib.py files under content/python_files are generated by
# utils/extract_defs.py: never lint or format them. The book/ and jupyterlite/
# trees are symlinks to content/, skip them to avoid linting the same files
# several times.
extend-exclude = [
    "content/python_files/*_lib.py",
    "book/content",
    "jupyterlite/content",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    # Imports are not at the top of jupytext scripts since each `# %%` cell is
    # a standalone chunk of a notebook.
    "E402",
    # Line length is enforced by the formatter.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tutorial scripts intentionally keep imports and re-imports that are only
# used when the reader uncomments cells or runs the notebook interactively.
"content/python_files/*.py" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = [
    "tutorial_helpers",
    "feature_engineering_lib",
    "next_horizon_prediction_lib",
    "prediction_intervals_lib",
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
  content/python_files/.*_lib\.py
  | content/notebooks
  | book/content
  | book/_build
  | jupyterlite/content
  | \.pixi
)/
'''
