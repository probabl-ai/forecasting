repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

# The lint and format pixi tasks and CI use the same tools/versions:
#   pixi run -e lint lint     # check
#   pixi run -e lint format   # apply
