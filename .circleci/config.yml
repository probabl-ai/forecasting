version: 2.1

jobs:
  build-book:
    # gen3 resource classes require the Linux VM executor and the current image tag.
    machine:
      image: ubuntu-2204:current
    # large.gen3: 4 vCPUs, 16 GiB memory
    resource_class: large.gen3
    environment:
      TABICL_TRAIN_SIZE: "1000"
    steps:
      - checkout
      - run:
          name: Install pixi
          command: curl -fsSL https://pixi.sh/install.sh | bash
      - run:
          name: Build the book
          command: ~/.pixi/bin/pixi run build-book
      - store_artifacts:
          path: book/_build/html
          destination: book

workflows:
  build:
    jobs:
      - build-book
