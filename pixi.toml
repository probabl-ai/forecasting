[project]
name = "forecasting"
version = "0.1.0"
description = "Forecasting"
authors = ["Guillaume Lemaitre <guillaume@probabl.ai>", "Olivier Grisel <olivier@probabl.ai>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
create-notebooks-dir = { cmd = "mkdir -p ./content/notebooks" }
scrape-function-definitions = { cmd = "python utils/extract_defs.py" }
copy-tutorial-helpers = { cmd = "cp ./content/python_files/tutorial_helpers.py ./content/notebooks/tutorial_helpers.py && cp ./content/python_files/*_lib.py ./content/notebooks/", depends-on = ["create-notebooks-dir", "scrape-function-definitions"] }
convert-to-notebooks = { cmd = "python utils/convert_to_notebooks.py", depends-on = ["create-notebooks-dir", "copy-tutorial-helpers", "scrape-function-definitions"] }
convert-to-executed-notebooks = { cmd = "python utils/convert_to_notebooks.py --execute", depends-on = ["create-notebooks-dir", "copy-tutorial-helpers", "scrape-function-definitions"] }
build-book = { cmd = "jupyter-book build book", depends-on = ["convert-to-notebooks", "copy-tutorial-helpers", "scrape-function-definitions"] }
build-jupyterlite = { cmd = "jupyter lite build --contents content --output-dir dist", cwd = "jupyterlite", depends-on = ["convert-to-notebooks"] }
serve-jupyterlite = { cmd = "python -m http.server", cwd = "jupyterlite/dist", depends-on = ["build-jupyterlite"] }
lint = "ruff check . && black --check ."
format = "ruff check --fix . && black ."
install-pre-commit = "pre-commit install"

[dependencies]
notebook = ">=7.4.3,<8"
jupyterlab = ">=4.4.3,<5"
jupytext = ">=1.17.2,<2"
scikit-learn = ">=1.7.0,<2"
skrub = ">=0.10.0,<1"
polars = "==1.24.0"
matplotlib-base = ">=3.10.3,<4"
pyarrow = ">=20.0.0,<21"
holidays = ">=0.75,<0.76"
pip = ">=25.1.1,<26"
ipyleaflet = ">=0.20.0,<0.21"
pandas = ">=2.3.0,<3"
mlforecast = ">=1.0.2,<2"
altair = ">=5.5.0,<6"
graphviz = ">=13.1.0,<14"
pydot = ">=4.0.1,<5"
u8darts = ">=0.36.0,<0.37"
setuptools = "<81"
plotly = ">=6.2.0,<7"
cloudpickle = ">=3.0.0,<3.1"
optuna = ">=4.0.0,<5"
ipykernel = "*"
ruff = "*"
black = "*"
pre-commit = ">=4.6.2,<5"
jupyter-book = ">=1.0.4,<2"
jupyterlite = "*"
jupyterlite-pyodide-kernel = "*"
python-libarchive-c = "*"
tabicl = ">=2.2.0"

[pypi-dependencies]
openmeteo-requests = ">=1.5.0, <2"
requests-cache = ">=1.2.1, <2"
retry-requests = ">=2.0.0, <3"
