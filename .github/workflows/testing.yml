name: 'test'

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - '*'

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.68.0

      - name: Run tests
        run: |
            pixi run convert-to-executed-notebooks

      - name: Test if we can build the documentation
        if: matrix.os == 'ubuntu-latest'
        run: pixi run build-book
